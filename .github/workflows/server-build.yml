name: OpenGSServer build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenGSServer.csproj

      - name: Restore tests
        run: dotnet restore Tests/OpenGSServer.Tests.csproj

      - name: Build
        run: dotnet build OpenGSServer.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/OpenGSServer.Tests.csproj --configuration Release --no-restore

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lobby and mission smoke
        shell: pwsh
        run: ./tools/run_smoke.ps1 -Configuration Release
